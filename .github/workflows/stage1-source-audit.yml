name: VN Stage-1 Source Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/source-stage1.js'
      - 'migration/cloudstream-sources.json'
      - '.github/workflows/stage1-source-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tests/source-stage1.js
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-public-source-audit
          path: migration/reports/stage1-public-sources.json
