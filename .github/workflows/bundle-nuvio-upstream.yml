name: Bundle upstream Nuvio plugins into single VN manifest
on:
  push:
    branches: [main]
    paths:
      - 'migration/bundle-nuvio-upstream.js'
      - '.github/workflows/bundle-nuvio-upstream.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check migration/bundle-nuvio-upstream.js
      - run: node migration/bundle-nuvio-upstream.js
      - run: node tests/check.js
      - name: Commit bundled manifest and upstream provider sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json upstream/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh bundled upstream Nuvio providers"
            git push
          fi
