name: VN Live Media Smoke (not device playback)
on:
  push:
    paths:
      - 'tests/live-check.js'
      - 'manifest.json'
      - 'v5/manifest.json'
      - '.github/workflows/live-media-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 2'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check.js
      - run: node tests/live-check.js
        env:
          TMDB_TEST_IDS: '550'
          MAX_STREAMS: '3'
          TIMEOUT_MS: '12000'
      - run: MANIFEST_PATH=v5/manifest.json REPORT_PATH=migration/reports/v5-live-smoke.json TMDB_TEST_IDS=10331,550 node tests/live-check.js
        continue-on-error: true
      - run: MANIFEST_PATH=nuvio/manifest.json REPORT_PATH=migration/reports/nuvio-live-smoke.json TMDB_TEST_IDS=10331,550 node tests/live-check.js
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-media-smoke-report
          path: migration/reports/
          if-no-files-found: warn
