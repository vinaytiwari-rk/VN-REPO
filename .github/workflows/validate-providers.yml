name: VN Provider Validation
on:
  push:
    paths:
      - 'manifest.json'
      - 'providers/**'
      - 'tests/**'
      - '.github/workflows/validate-providers.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check.js
